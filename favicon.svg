<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <circle cx="50" cy="50" r="46" fill="url(#grad)" stroke="#10b981" stroke-width="2"/>
  <circle cx="50" cy="50" r="18" fill="#f59e0b" filter="url(#glow)"/>
  <!-- Sun rays -->
  <path d="M50 14v8 M50 78v8 M14 50h8 M78 50h8 M24 24l6 6 M70 70l6 6 M24 76l6-6 M70 30l6-6" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>
  <!-- PV panel grid overlay -->
  <path d="M36 44h28v20H36z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="2"/>
  <path d="M43 44v20 M50 44v20 M57 44v20 M36 54h28" stroke="#38bdf8" stroke-width="1"/>
  <!-- Diesel generator bolt icon -->
  <path d="M64 26l-7 14h8l-8 16 14-16h-7z" fill="#22c55e"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="20" y="20" width="60" height="60" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
